name: Build Windows

on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Construire Launchy.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name Launchy
          --paths launcher launcher/launchy.py

      - uses: actions/upload-artifact@v4
        with:
          name: Launchy-windows
          path: dist/Launchy.exe
